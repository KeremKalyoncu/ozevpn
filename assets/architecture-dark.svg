    <text x="455" y="22" text-anchor="middle" fill="#6ee7b7" font-family="'Cascadia Mono', Consolas, monospace" font-size="11.2" font-weight="700">FAIL-CLOSED SHIELD · WFP Kill Switch · Dual-Stack IPv6 TUN · Anti-WebRTC UDP · Zero Runtime Traces on Exit</text>

name: Signed Release Provenance (SLSA)

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-provenance:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '^1.26.11'

      - name: Verify full test suite
        run: |
          go vet ./...
          go test -race ./...

      - name: Build slim OzeVPN Windows binary with provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $sha = git rev-parse --short HEAD
          $dt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          go build -trimpath -ldflags="-H=windowsgui -s -w -X main.buildCommit=$sha -X main.buildDate=$dt" -o dist\OzeVPN-core.exe ./cmd/ozevpn
          $hash = (Get-FileHash dist\OzeVPN-core.exe -Algorithm SHA256).Hash.ToUpper()
          Set-Content -Path dist\OzeVPN-core.exe.sha256 -Value "$hash  OzeVPN-core.exe  # commit=$sha date=$dt"

      - name: Attest SLSA Build Provenance (Sigstore)
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/OzeVPN-core.exe'

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ozevpn-core-windows-amd64
          path: |
            dist/OzeVPN-core.exe
            dist/OzeVPN-core.exe.sha256
          retention-days: 14

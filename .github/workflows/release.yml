name: Signed Release Provenance (SLSA)

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-provenance:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '^1.26.11'

      - name: Install Sigstore Cosign
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == false
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Verify full test suite
        run: |
          go vet ./...
          go test -race ./...

      - name: Package and publish Windows binary via GoReleaser
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign release artifacts with Sigstore Cosign (keyless OIDC)
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == false
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $bundles = @()
          Get-ChildItem -Path dist -Recurse -File | Where-Object { $_.Name -match '^(OzeVPN-core.*\.exe|OzeVPN-core-checksums\.txt)$' } | ForEach-Object {
            $bundle = "$($_.FullName).sigstore.json"
            cosign sign-blob --yes --bundle $bundle $_.FullName
            $bundles += $bundle
          }
          if ($bundles.Count -gt 0) {
            gh release upload $tag @bundles --clobber
          }

      - name: Build slim OzeVPN Windows binary (manual dispatch)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $sha = git rev-parse --short HEAD
          $dt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          go build -trimpath -ldflags="-H=windowsgui -s -w -X main.buildCommit=$sha -X main.buildDate=$dt" -o dist\OzeVPN-core.exe ./cmd/ozevpn
          $hash = (Get-FileHash dist\OzeVPN-core.exe -Algorithm SHA256).Hash.ToUpper()
          Set-Content -Path dist\OzeVPN-core.exe.sha256 -Value "$hash  OzeVPN-core.exe  # commit=$sha date=$dt"

      - name: Attest SLSA Build Provenance (GitHub Attestations)
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/**/*.exe'

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ozevpn-core-windows-amd64
          path: |
            dist/**/*.exe
            dist/*.txt
            dist/*.sha256
            dist/**/*.sigstore.json
          retention-days: 14

  release-android:
    name: Build, Sign & Publish Android APKs
    needs: [ build-provenance ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '8.14.3'

      - name: Install Sigstore Cosign
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == false
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Fetch & SHA-256 verify official Android cores
        run: bash android/scripts/fetch-cores.sh

      - name: Run unit tests and build signed release APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_B64}" ]; then
            echo "${ANDROID_KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/ozevpn-release.jks"
            chmod 600 "${RUNNER_TEMP}/ozevpn-release.jks"
            export ANDROID_KEYSTORE_PATH="${RUNNER_TEMP}/ozevpn-release.jks"
          fi
          gradle testDebugUnitTest assembleRelease --no-daemon
          rm -f "${RUNNER_TEMP}/ozevpn-release.jks"

      - name: Package named APKs with SHA-256 checksums
        run: |
          mkdir -p android-dist
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk android-dist/OzeVPN-Android-arm64.apk
          cp android/app/build/outputs/apk/release/app-universal-release.apk android-dist/OzeVPN-Android-universal.apk
          (cd android-dist && sha256sum OzeVPN-Android-arm64.apk OzeVPN-Android-universal.apk > OzeVPN-Android.sha256)
          cat android-dist/OzeVPN-Android.sha256

      - name: Sign Android APKs with Sigstore Cosign and upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            for f in android-dist/OzeVPN-Android-arm64.apk android-dist/OzeVPN-Android-universal.apk android-dist/OzeVPN-Android.sha256; do
              cosign sign-blob --yes --bundle "${f}.sigstore.json" "${f}"
            done
          fi
          gh release upload "${GITHUB_REF_NAME}" android-dist/* --clobber

      - name: Attest Android APK SLSA Build Provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'android-dist/*.apk'

      - name: Upload Android build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ozevpn-android-release
          path: android-dist/*
          retention-days: 14

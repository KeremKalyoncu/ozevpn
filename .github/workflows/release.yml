name: Signed Release Provenance (SLSA)

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-provenance:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      hashes: ${{ steps.subjects.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '^1.26.11'

      - name: Verify full test suite
        run: |
          go vet ./...
          go test -race ./...

      - name: Package and publish Windows binary via GoReleaser
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build slim OzeVPN Windows binary (manual dispatch)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $sha = git rev-parse --short HEAD
          $dt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          go build -trimpath -ldflags="-H=windowsgui -s -w -X main.buildCommit=$sha -X main.buildDate=$dt" -o dist\OzeVPN-core.exe ./cmd/ozevpn
          $hash = (Get-FileHash dist\OzeVPN-core.exe -Algorithm SHA256).Hash.ToUpper()
          Set-Content -Path dist\OzeVPN-core.exe.sha256 -Value "$hash  OzeVPN-core.exe  # commit=$sha date=$dt"

      - name: Compute SLSA Level 3 subjects
        id: subjects
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $lines = @()
          Get-ChildItem -Path dist -File | Where-Object { $_.Name -match '\.(exe|txt)$' } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $($_.Name)"
          }
          $text = ($lines -join "`n") + "`n"
          $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($text))
          "hashes=$b64" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attest SLSA Build Provenance (GitHub Attestations)
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.exe'

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ozevpn-core-windows-amd64
          path: |
            dist/*.exe
            dist/*.txt
            dist/*.sha256
          retention-days: 14

  slsa-provenance:
    needs: build-provenance
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == false
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.build-provenance.outputs.hashes }}
      upload-assets: true

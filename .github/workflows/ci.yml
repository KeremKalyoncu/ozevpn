name: OzeVPN CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Static analysis (go vet)
        run: go vet ./...

      - name: Unit, security & schema tests
        run: go test -v -cover ./...

      - name: Reproducible build check
        run: go build -trimpath -ldflags="-s -w" -o ozevpn.exe .

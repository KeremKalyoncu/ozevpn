name: OzeVPN CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '^1.26.11'

      - name: Formatting check (gofmt)
        shell: pwsh
        run: |
          $unfmt = gofmt -l .
          if ($unfmt) {
            Write-Error "Unformatted Go files:`n$unfmt"
            exit 1
          }

      - name: Static analysis (go vet + staticcheck)
        shell: pwsh
        run: |
          go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Frontend syntax check (Node)
        shell: pwsh
        run: |
          node --check web/app.js
          node --check web/theme.js

      - name: Unit, security, race & schema tests
        run: go test -race -v -cover ./...

      - name: Short fuzzing regression gate
        run: |
          go test -fuzz=FuzzCleanDomain -fuzztime=5s ./internal/config
          go test -fuzz=FuzzParseCustomOutbound -fuzztime=5s ./internal/engine

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Repository secret scan
        shell: pwsh
        run: |
          $files = git ls-files | Where-Object { $_ -notmatch '\.(zip|ico|syso|png|jpg|exe|pdf)$' }
          $hits = Select-String -Path $files -Pattern '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{32,})' -ErrorAction SilentlyContinue
          if ($hits) { $hits | Format-Table Path, LineNumber; exit 1 }
          Write-Output "SECRET_SCAN_CLEAN"

      - name: Reproducible build & live Windows control-plane smoke test
        shell: pwsh
        run: |
          $sha = git rev-parse --short HEAD
          $dt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          go build -trimpath -ldflags="-s -w -X main.buildCommit=$sha -X main.buildDate=$dt" -o ozevpn.exe ./cmd/ozevpn

          $proc = Start-Process -FilePath '.\ozevpn.exe' -ArgumentList '-no-browser','-no-tray','-silent','-addr','127.0.0.1:17777' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:17777/api/healthz' -TimeoutSec 3 -UseBasicParsing
                if ($r.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw "ozevpn.exe /api/healthz did not become ready" }

            # Verify security headers on /api/healthz
            if ($r.Headers['X-Frame-Options'] -ne 'DENY') { throw "Missing X-Frame-Options: DENY" }
            if ($r.Headers['Content-Security-Policy'] -notmatch "default-src 'self'") { throw "Missing strict CSP" }

            # Verify /proxy.pac serves valid JS PAC
            $pac = Invoke-WebRequest -Uri 'http://127.0.0.1:17777/proxy.pac' -TimeoutSec 3 -UseBasicParsing
            if ($pac.StatusCode -ne 200 -or $pac.Content -notmatch 'FindProxyForURL') { throw "Invalid /proxy.pac response" }

            # Verify unauthenticated /api/config is fail-closed with 401
            $unauthStatus = 0
            try {
              Invoke-WebRequest -Uri 'http://127.0.0.1:17777/api/config' -TimeoutSec 3 -UseBasicParsing | Out-Null
            } catch {
              $unauthStatus = [int]$_.Exception.Response.StatusCode
            }
            if ($unauthStatus -ne 401) { throw "Expected 401 on unauthenticated /api/config, got $unauthStatus" }

            Write-Output "LIVE_WINDOWS_SMOKE_PASS commit=$sha"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Remove-Item -Force -ErrorAction SilentlyContinue ozevpn.exe, ozevpn.json, .ozevpn_token
          }
